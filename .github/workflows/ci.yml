name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test docs
        run: pnpm --filter docs test

      - name: Test UI with coverage
        run: pnpm --filter @swiftuijs/ui test:coverage

      - name: Verify published package
        run: pnpm --filter @swiftuijs/ui test:package

      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser acceptance
        run: pnpm test:browser

      - name: Documentation reading acceptance
        run: pnpm test:docs-browser

      - name: Component visual geometry acceptance
        run: pnpm test:components

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  react-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18.2.0', '18.3.1', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swiftuijs/ui build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify packed consumer types, SSR, hydration and interactions
        run: pnpm --filter @swiftuijs/ui exec node scripts/verify-package.mjs ${{ matrix.react }}
